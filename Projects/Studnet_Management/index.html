<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        
        <div class="form-section">
            <h2>Add / Edit Student</h2>
            <form id="studentForm">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" placeholder="Enter student name">
                </div>
            
                <div class="form-group">
                    <label for="rollNumber">Roll Number:</label>
                    <input type="text" id="rollNumber" placeholder="Enter roll number">
                </div>
                
                <div class="form-group">
                    <label for="marks">Marks:</label>
                    <input type="number" id="marks" placeholder="Enter marks">
                </div>
                
                <div class="button-group">
                    <button type="submit" id="submitBtn">Add Student</button>
                    <button type="button" id="cancelBtn" style="display: none;">Cancel</button>
                </div>
            </form>
        </div>
        
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search student by name...">
            <button onclick="searchStudent()">Search</button>
            <button onclick="displayAllStudents()">Show All</button>
        </div>
        
        <div class="table-section">
            <h2>Student List</h2>
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Marks</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">

                </tbody>
            </table>
            <p id="noData" style="display: none; text-align: center; color: #666;">No students found.</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
